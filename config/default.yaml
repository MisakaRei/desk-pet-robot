# 桌面宠物机器人默认配置
# 作者：敕仞
# 所有阈值、模型路径、摄像头索引和串口参数集中在这里，源码中不写魔法数字。
# 本阶段在 PC 上验证，后续迁移 Linux ARM 时只改配置和硬件访问层。

camera:
  # null 表示自动探测；需要固定设备时再填具体索引
  preferred_index: null
  # 自动探测范围包含 0 和 probe_max_index 本身
  probe_max_index: 4
  width: 1280
  height: 720
  fps: 30

detector:
  model_path: models/yolo11n.pt
  image_size: 640
  confidence_threshold: 0.45
  iou_threshold: 0.5
  device: cpu
  # COCO 类别编号：0 人，15 猫
  target_classes:
    person: 0
    cat: 15

tracking:
  # 两帧检测框 IoU 高于此值才视为同一目标
  match_iou_threshold: 0.30
  # 方位角与距离的低通平滑系数，越小越稳但跟随越慢
  smoothing_alpha: 0.60
  # 检测短暂漏帧时保留跟踪轨迹的时间；状态机的 3 秒超时是另一层逻辑
  max_lost_s: 0.50
  # 距离粗估的假设：用摄像头水平视场角换算像素焦距，
  # 再按“焦距 × 假设身高 ÷ 目标框高”估算。没有深度信息，仅用于行为决策。
  horizontal_fov_deg: 60.0
  assumed_height_m:
    person: 1.70
    cat: 0.25

brain:
  # 以人为互动目标；猫仍会被检测并显示
  target_kind: person
  # 大于该距离尝试靠近，小于后退距离则后退；中间区域保持 WATCH
  approach_distance_m: 1.50
  backoff_distance_m: 0.80
  # 目标连续消失超过该时长回到 IDLE
  lost_timeout_s: 3.0
  # 尚未接底盘时先给出期望速度，阶段 5 再通过串口 dry-run 发出
  approach_speed_mps: 0.15
  backoff_speed_mps: 0.12
  # 底盘的转向指令按目标方位角比例给出，并限制最大角速度
  turn_gain: 1.50
  max_turn_rate_rad_s: 0.80
  turn_deadband_deg: 2.0
  # 云台转角限制只是一个保守的初始值，接实物后按机械行程调整
  gimbal_limit_deg: 60.0

face:
  title: "PetBot - Face"
  width: 240
  height: 280
  fps: 30
  # pygame 使用 RGB；这里不是调试窗口的 BGR
  background_rgb: [8, 14, 19]
  eye_rgb: [237, 247, 243]
  pupil_rgb: [10, 23, 28]
  accent_rgb: [93, 225, 193]
  eye:
    spacing_px: 86
    radius_px: 38
    pupil_radius_px: 16
    max_look_offset_px: 14
    follow_smoothing: 0.22
    blink_min_interval_s: 2.0
    blink_max_interval_s: 6.0
    blink_duration_s: 0.16
    # 目标方位角到这个角度时，瞳孔到达最大偏移，再大的角度保持贴边
    gaze_range_deg: 45.0

ui:
  dashboard:
    enabled: true
    # 只监听回环地址，调试页面不会暴露到局域网
    host: "127.0.0.1"
    port: 8765
    auto_open_browser: true
    # 摄像头或模型启动失败时保留页面，方便在浏览器里查看错误和日志
    keep_alive_on_error: true
    # 浏览器端的 MJPEG 帧率和 JPEG 质量；降低这些值可减轻 Linux ARM 的编码负担
    stream_fps: 12
    jpeg_quality: 80
    max_stream_width: 960
    log_history: 400
  debug_window:
    # 先用英文标题，避免 OpenCV 在高 DPI Windows 下对中文窗口名编码不稳定
    title: "PetBot - Vision Debug"
    # waitKey 的等待时间决定窗口响应速度；1ms 足够刷新又不拖慢采集
    wait_key_ms: 1
    box_thickness: 2
    font_scale: 0.6
    font_thickness: 1
    label_padding_px: 6
    # OpenCV 使用 BGR 顺序，不是 RGB
    person_color_bgr: [80, 220, 120]
    cat_color_bgr: [80, 180, 255]
    text_color_bgr: [255, 255, 255]

serial:
  # 默认无硬件调试，只打印帧；接上真设备后改为 false
  dry_run: true
  baudrate: 115200
  write_timeout_s: 0.05
  read_timeout_s: 0.05
  # 控制帧发送周期；阶段 1 无硬件，2Hz 足够看清 dry-run，接实物后可提高
  send_period_s: 0.50
  # 不写死 COM 号；按 VID/PID 顺序匹配常见的 ESP32 原生 USB 与 USB 转串口芯片。
  # 硬件确定后可按实际值替换或调整顺序。
  vid_pid_candidates:
    - vid: 0x303A
      pid: 0x1001
    - vid: 0x1A86
      pid: 0x7523
    - vid: 0x10C4
      pid: 0xEA60
  # 状态回报帧的发送周期
  status_period_s: 0.5
