[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desk-pet-robot"
version = "0.1.0"
description = "桌面宠物机器人第一阶段软件验证"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "敕仞" }]
dependencies = [
    "opencv-python>=4.9",
    "ultralytics>=8.2",
    "numpy>=1.26",
    "pyserial>=3.5",
    "pygame>=2.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
petbot = ["ui/web/*.html", "ui/web/*.css", "ui/web/*.js"]
